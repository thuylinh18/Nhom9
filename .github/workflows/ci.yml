name: CI Pipeline - Continuous Integration

on:
  push:
    branches:
      - main
      - master
      - dev
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-ci:
    name: Backend CI (Django & Pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DJANGO_SETTINGS_MODULE: config.settings
      SECRET_KEY: django-insecure-ci-test-key-for-github-actions
      DEBUG: "False"
      USE_SQLITE: "True"
      ALLOWED_HOSTS: localhost,127.0.0.1
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || 'dummy-ci-gemini-key' }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Django System Check
        run: |
          python manage.py check

      - name: Check Unapplied Migrations Drift
        run: |
          python manage.py makemigrations --check --dry-run

      - name: Run Backend Test Suite (Pytest)
        run: |
          pytest -v --durations=10

  frontend-ci:
    name: Frontend CI (React TypeScript Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          npm ci

      - name: TypeScript Type Check
        run: |
          npm run type-check

      - name: Run Frontend Tests
        run: |
          npm test

      - name: Build Frontend Production Bundle
        run: |
          npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL || 'https://insightflow-backend.onrender.com' }}

  ci-status:
    name: CI Pipeline Status Check
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci]
    if: always()
    steps:
      - name: Verify All CI Jobs Passed
        run: |
          if [ "${{ needs.backend-ci.result }}" != "success" ] || [ "${{ needs.frontend-ci.result }}" != "success" ]; then
            echo "CI pipeline failed! Backend: ${{ needs.backend-ci.result }}, Frontend: ${{ needs.frontend-ci.result }}"
            exit 1
          fi
          echo "All Backend and Frontend CI checks passed successfully! Project is ready for deployment."
